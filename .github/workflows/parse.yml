name: Parse Repository

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Source repo (org/name)'
        required: true
      tag:
        description: 'Git tag to parse'
        required: true
      storage_repo:
        description: 'Storage repo (repolex-forx/org--name)'
        required: true
      parser_ref:
        description: 'Parser git ref to install'
        required: false
        default: 'main'
      phase:
        description: 'Phase to run: parse | ast | enrich | combine'
        required: true
        default: 'parse'

jobs:
  run:
    name: "${{ inputs.phase }} ${{ inputs.repo }}@${{ inputs.tag }} (parser_ref=${{ inputs.parser_ref }})"
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # SETUP — runs for every dispatch (~3-5 min total)
      # ============================================================

      - name: Setup storage repo
        env:
          GH_TOKEN: ${{ secrets.REPOLEX_PAT }}
        run: |
          if ! gh repo view ${{ inputs.storage_repo }} &>/dev/null; then
            VISIBILITY=$(gh repo view ${{ inputs.repo }} --json isPrivate --jq 'if .isPrivate then "--private" else "--public" end' 2>/dev/null || echo "--public")
            gh repo create ${{ inputs.storage_repo }} \
              $VISIBILITY \
              --description "RDF parse data for ${{ inputs.repo }}" \
              --homepage "https://github.com/${{ inputs.repo }}"
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ inputs.storage_repo }}.git" storage || {
            mkdir storage && cd storage && git init
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ inputs.storage_repo }}.git"
          }

          cd storage
          git config user.name "repolex-bot"
          git config user.email "bot@repolex.ai"

          if ! git rev-parse HEAD &>/dev/null; then
            echo "Initializing" > README.md
            git add README.md
            git commit -m "Initial commit"
            git branch -M main
            git push -u origin main
          fi

      - name: Clone and checkout source
        id: checkout-source
        env:
          GH_TOKEN: ${{ secrets.REPOLEX_PAT }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ inputs.repo }}.git" /tmp/source
          cd /tmp/source
          git fetch --tags
          git checkout ${{ inputs.tag }}
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install repolex
        env:
          GH_TOKEN: ${{ secrets.REPOLEX_PAT }}
        run: |
          uv tool install "git+https://x-access-token:${GH_TOKEN}@github.com/repolex-ai/repolex-parser-py.git@${{ inputs.parser_ref }}"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure git auth
        env:
          GH_TOKEN: ${{ secrets.REPOLEX_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      # ============================================================
      # JAVA SETUP — only for non-parse phases on Maven repos
      # ============================================================

      - name: Cache Maven local repository
        if: inputs.phase != 'parse'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ inputs.repo }}-${{ inputs.tag }}
          restore-keys: |
            m2-${{ runner.os }}-${{ inputs.repo }}-
            m2-${{ runner.os }}-

      - name: Materialize Maven dependencies (Java repos)
        if: inputs.phase != 'parse'
        run: |
          # JDTLS reads from ~/.m2/ to resolve symbols. Without this step, JDTLS
          # tries to download deps live during LSP requests, causing slow None
          # responses for legitimate symbols. Cached between dispatches via
          # the actions/cache step above.
          if [ -f "/tmp/source/pom.xml" ]; then
            echo "Found pom.xml — resolving Maven dependencies..."
            cd /tmp/source
            mvn dependency:resolve -B -q -DskipTests || echo "Maven resolve failed (continuing — JDTLS may fall back to live downloads)"
          else
            echo "No pom.xml at top level — skipping Maven resolve"
          fi

      # ============================================================
      # LSP SETUP — only for phases that need language servers
      # ============================================================

      - name: Cache LSP servers
        if: inputs.phase != 'parse'
        id: lsp-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/uv/tools/repolex/lib/python3.12/site-packages/multilspy/language_servers
            ~/.local/share/uv/tools/repolex/lib/python3.13/site-packages/multilspy/language_servers
            ~/.multilspy
            ~/.local/share/uv/tools/repolex/lib/python3.12/site-packages/multilspy/language_servers/sourcekit_lsp/static
            ~/.local/share/uv/tools/repolex/lib/python3.13/site-packages/multilspy/language_servers/sourcekit_lsp/static
          key: lsp-servers-${{ runner.os }}-v5
          restore-keys: |
            lsp-servers-${{ runner.os }}-

      - name: Warm LSP servers
        if: inputs.phase != 'parse' && steps.lsp-cache.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss - warming all LSP servers..."

          # Install Go LSP server
          go install golang.org/x/tools/gopls@latest 2>/dev/null || echo "gopls install failed"

          # Install Ruby LSP server (user-level to avoid permission issues)
          gem install --user-install solargraph 2>/dev/null || echo "solargraph install failed"
          export PATH="$HOME/.local/share/gem/ruby/3.2.0/bin:$PATH"

          REPOLEX_VENV="$HOME/.local/share/uv/tools/repolex"
          $REPOLEX_VENV/bin/python << 'PYEOF'
          import time, tempfile
          from pathlib import Path

          from multilspy.multilspy_config import MultilspyConfig, Language
          from multilspy.multilspy_logger import MultilspyLogger
          from multilspy.language_server import LanguageServer

          languages = [
              ("Python", Language.PYTHON),
              ("Java", Language.JAVA),
              ("TypeScript", Language.TYPESCRIPT),
              ("JavaScript", Language.JAVASCRIPT),
              ("Rust", Language.RUST),
              ("Go", Language.GO),
              ("Ruby", Language.RUBY),
              ("C#", Language.CSHARP),
              ("Kotlin", Language.KOTLIN),
              ("Dart", Language.DART),
              ("Scala", Language.SCALA),
              ("Swift", Language.SWIFT),
          ]

          logger = MultilspyLogger()

          for name, lang in languages:
              start = time.time()
              print(f"Warming {name}...", end=" ", flush=True)
              try:
                  with tempfile.TemporaryDirectory() as tmpdir:
                      dummy = Path(tmpdir) / "dummy.txt"
                      dummy.write_text("// dummy\n")
                      config = MultilspyConfig.from_dict({"code_language": lang})
                      lsp = LanguageServer.create(config, logger, str(tmpdir))
                      print(f"OK ({time.time() - start:.1f}s)")
              except Exception as e:
                  print(f"WARN ({time.time() - start:.1f}s): {e}")

          print("\nLSP warm-up complete!")
          PYEOF

      # ============================================================
      # PHASE EXECUTION
      # ============================================================

      - name: Run phase
        env:
          REPOLEX_STORAGE_DIR: ${{ github.workspace }}/storage
          GH_TOKEN: ${{ secrets.REPOLEX_PAT }}
          PYTHONUNBUFFERED: "1"
          REPOLEX_SKIP_LSP: "1"
        run: |
          export PATH="$HOME/go/bin:$HOME/.local/share/gem/ruby/3.2.0/bin:$PATH"
          cd /tmp/source

          set +e
          if [ "${{ inputs.phase }}" = "parse" ]; then
            repolex parse ${{ inputs.repo }} ${{ inputs.tag }} --gh
          else
            repolex aggregate ${{ inputs.repo }} ${{ inputs.tag }} --phase ${{ inputs.phase }} --repo-path /tmp/source
          fi
          EXIT_CODE=$?
          set -e

          # Exit codes 0 and 7 are both "parser exited cleanly, .next-action.json
          # was written." Anything else is a real error.
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 7 ]; then
            echo "Parser failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

          echo "Parser exited with code $EXIT_CODE (treated as success — .next-action.json should drive next dispatch)"

      # ============================================================
      # COMMIT STORAGE STATE — runs after every phase
      # ============================================================

      - name: Commit storage state
        env:
          GH_TOKEN: ${{ secrets.REPOLEX_PAT }}
        run: |
          cd ${{ github.workspace }}/storage
          git add -A
          if ! git diff --staged --quiet; then
            git pull --rebase origin main || true
            git commit -m "Phase ${{ inputs.phase }} for ${{ inputs.repo }}@${{ inputs.tag }} (${{ env.COMMIT_SHA }})"
            git push
          else
            echo "No storage changes to commit for phase ${{ inputs.phase }}"
          fi

      # ============================================================
      # COMBINE PHASE FINALIZATION — only after combine succeeds
      # ============================================================

      - name: Generate README (combine phase only)
        if: inputs.phase == 'combine'
        run: |
          cd ${{ github.workspace }}/storage
          PARSE_DATE=$(date -u +"%Y-%m-%d")

          TREE=$(find . -name '*.nq.gz' -o -name '*.nq' | grep -v '.git' | sed 's|^\./||' | sort | head -200 | tree --fromfile -n 2>/dev/null || find . \( -name '*.nq.gz' -o -name '*.nq' \) -not -path './.git/*' | sed 's|^\./||' | sort | awk -F/ '
          {
            for (i=1; i<NF; i++) {
              prefix = ""
              for (j=1; j<i; j++) prefix = prefix "    "
              dir = prefix $i "/"
              if (!(dir in seen)) { print dir; seen[dir]=1 }
            }
            prefix = ""
            for (j=1; j<NF; j++) prefix = prefix "    "
            print prefix $NF
          }' | head -60)

          cat > README.md << 'READMEEOF'
          # Repolex Knowledge Graph of ${{ inputs.repo }}

          RDF knowledge graph data for [${{ inputs.repo }}](https://github.com/${{ inputs.repo }}), parsed by [repolex](https://repolex.ai).

          > **Note**: This data is experimental and subject to change without notice.

          ## How to use this data

          The easiest way to get started is to install the [lexq](https://github.com/repolex-ai/lexq) query tool using [uv](https://docs.astral.sh/uv/getting-started/installation/).

          If you have uv installed, just copy/paste this into your terminal:

          ```bash
          uv tool install git+https://github.com/repolex-ai/lexq
          ```

          This installs lexq onto your system, in your user context. Verify the install:

          ```bash
          lexq --help
          ```

          **lexq is designed to be used primarily by LLMs in a terminal.** Start up your favorite LLM and ask it to use the lexq tool. It's that easy!

          To load this repo's data:

          ```bash
          lexq download ${{ inputs.repo }}
          ```

          This will automatically download essential data files from the last parsed commit. Consult `lexq --moreinfo` for other options, including downloading multiple commits, blobs, etc.

          ## Data structure

          All data is stored as gzip-compressed [N-Quads](https://www.w3.org/TR/n-quads/) (`.nq.gz`), a standard RDF format that can be loaded into any triplestore or graph database.

          ```
          READMEEOF

          sed -i 's/^          //' README.md

          echo "$TREE" >> README.md
          echo '```' >> README.md

          cat >> README.md << 'DESCEOF'

          | Directory | What it contains |
          |-----------|-----------------|
          | `blob/` | Per-file AST graphs, content-addressed by git blob SHA. Each file in the source repo gets its own graph. |
          | `aggregate/ast/` | Combined AST graph per parsed commit. Merges all blob graphs for a snapshot of the entire codebase at that point. |
          | `aggregate/lsp/` | Language Server Protocol enrichment: resolved symbols, definitions, references, and type information. |
          | `aggregate/dataflow/` | Interprocedural data flow edges between functions and modules. |
          | `aggregate/repolex/` | Combined graph (AST + LSP + dataflow) per commit. |
          | `commit/` | Git commit metadata (author, date, message, parent links). |
          | `branch/` | Branch metadata. |
          | `tag/` | Tag metadata. |
          | `filetree/` | File tree snapshots per commit (which files existed and their blob SHAs). |

          ## Source repository

          [${{ inputs.repo }}](https://github.com/${{ inputs.repo }})

          ---
          *Parsed on PARSE_DATE_PLACEHOLDER by [repolex](https://repolex.ai)*
          DESCEOF

          sed -i "s/PARSE_DATE_PLACEHOLDER/${PARSE_DATE}/" README.md

      - name: Build index.json (combine phase only)
        if: inputs.phase == 'combine'
        env:
          GH_TOKEN: ${{ secrets.REPOLEX_PAT }}
        run: |
          cd ${{ github.workspace }}/storage

          # Rebuild index.json from manifests/ directory
          python3 -c "
          import json, os, glob
          org_repo = '${{ inputs.repo }}'.split('/')
          versions = []
          for path in sorted(glob.glob('manifests/*.json')):
              with open(path) as f:
                  m = json.load(f)
              versions.append({
                  'commit': m.get('commit', ''),
                  'tag': m.get('tag', ''),
                  'parsed_at': m.get('parsed_at', ''),
              })
          versions.sort(key=lambda v: v.get('parsed_at', ''), reverse=True)
          index = {'org': org_repo[0], 'repo': org_repo[1], 'versions': versions}
          with open('index.json', 'w') as f:
              json.dump(index, f, indent=2)
              f.write('\n')
          print(f'Built index.json with {len(versions)} versions')
          "

          git add README.md index.json
          if ! git diff --staged --quiet; then
            git pull --rebase origin main || true
            git commit -m "Update README and index for ${{ inputs.repo }}@${{ inputs.tag }}"
            git push
          fi
