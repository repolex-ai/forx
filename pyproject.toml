[project]
name = "forx"
version = "0.1.0"
description = "Orchestrator for repolex-forx: parse every open source repo into RDF"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "click>=8.0",
    "packaging>=24.0",
    "rich>=13.0",
]

[project.scripts]
forx = "forx.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forx"]
